<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapView - Dual Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <!-- Main Camera View -->
    <div class="camera-view" id="cameraView">
        <div class="video-container">
            <video id="webcamFeed" autoplay playsinline muted></video>
            <canvas id="captureCanvas"></canvas>
            <div id="flashOverlay" class="flash-overlay"></div>
            <div id="analysisIndicator" class="analysis-indicator">Analyzing</div>
            
            <div id="statusOverlay" class="status-overlay">
                <div>
                    <div id="statusText">Ready to start camera</div>
                    <button id="startCameraBtn" class="start-camera-btn">Start Camera</button>
                    <div id="loadingSpinner" class="loading" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- Top overlay -->
        <div class="top-overlay">
            <div class="top-left">
                <div class="app-title">SnapView</div>
                <div class="status-info">
                    <div class="status-item" id="cameraStatus">Camera: Disconnected</div>
                    <div class="status-item" id="analysisStatus">Analysis: Ready</div>
                </div>
            </div>
            <div class="top-right">
                <button class="overlay-btn" id="settingsBtn" title="Prompts">⚙️</button>
                <button class="overlay-btn" id="switchCameraBtn" title="Switch Camera" disabled>🔄</button>
            </div>
        </div>

        <!-- Bottom overlay -->
        <div class="bottom-overlay">
            <!-- Quick presets -->
            <div class="preset-controls">
                <button class="preset-btn" data-preset="repair">🔧 Repair</button>
                <button class="preset-btn" data-preset="nickname">🏷️ Nickname</button>
                <button class="preset-btn" data-preset="identify">🔍 Identify</button>
                <button class="preset-btn" data-preset="nice">😊 Nice</button>
                <button class="preset-btn" data-preset="poetic">📝 Poetic</button>
                <button class="preset-btn" data-preset="forsale">💰 For Sale</button>
            </div>

            <!-- Main controls -->
            <div class="camera-controls">
                <div class="side-controls">
                    <button class="overlay-btn" id="startBtn" disabled>▶️</button>
                    <button class="overlay-btn" id="stopBtn" disabled>⏹️</button>
                </div>
                
                <button class="main-analyze-btn" id="analyzeBtn" disabled>
                    📸
                </button>
                
                <div class="side-controls">
                    <button class="overlay-btn" id="resultsBtn" disabled>📊</button>
                    <button class="overlay-btn" id="exportBtn" disabled>💾</button>
                </div>
            </div>
        </div>

        <div class="swipe-indicator">
            <span>Swipe left for results</span>
            <span class="swipe-arrow">→</span>
        </div>
    </div>

    <!-- Results View -->
    <div class="results-view" id="resultsView">
        <div class="results-header">
            <div class="results-title">Analysis Results</div>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>
        <div class="results-content" id="resultsContent">
            <div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.8);">
                No analyses yet. Start the camera and analyze to see results here.
            </div>
        </div>
    </div>

    <!-- Prompt Overlay -->
    <div class="prompt-overlay" id="promptOverlay">
        <div class="prompt-panel">
            <h3>Analysis Prompts</h3>
            
            <div class="prompt-group">
                <label for="primaryPrompt">Primary Analysis Prompt:</label>
                <textarea id="primaryPrompt" placeholder="Describe what you see in this image in detail. Focus on objects, people, activities, and the overall scene.">Describe what you see in this image in detail. Focus on objects, people, activities, and the overall scene.</textarea>
            </div>

            <div class="prompt-group">
                <label for="secondaryPrompt">Follow-up Analysis Prompt:</label>
                <textarea id="secondaryPrompt" placeholder="Based on the initial analysis, provide insights about potential actions, safety concerns, or interesting observations.">Based on the initial analysis, provide insights about potential actions, safety concerns, or interesting observations about what's happening in the scene.</textarea>
            </div>

            <div class="prompt-actions">
                <button class="btn secondary" id="cancelPromptBtn">Cancel</button>
                <button class="btn primary" id="savePromptBtn">Save</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
